    if (tab === "AC / mains") form(select("supply", "Supply", ["Single-phase", "Balanced three-phase"]) + field("rms", "Voltage \xB7 V RMS", 230) + field("amps", "Line current \xB7 A RMS", 10) + field("pf", "Power factor", 0.9) + select("reactive", "Load", ["Inductive / lagging", "Capacitive / leading"]), () => {
      const three = $("supply").value === "Balanced three-phase", r = acPower(num("rms"), num("amps"), num("pf"), three);
      output([["Active power P", fmt(r.active) + " W"], ["Apparent power S", fmt(r.apparent) + " VA"], ["Reactive power Q", fmt(r.reactive * ($("reactive").selectedIndex ? -1 : 1)) + " var"]], (three ? "Voltage is line-to-line; current is line current. Balanced sinusoidal load. P = \u221A3 V I PF." : "Voltage is line-to-neutral / across the load. P = V I PF.") + " RMS values. These calculations do not determine cable ratings, fault protection or safe installation. See OpenStax, University Physics 2, chapter 15.");
    });
    if (tab === "Calculator") form(select("solve", "Find", ["Current", "Voltage", "Resistance", "Power"]) + field("v", "Voltage \xB7 V", 12) + field("i", "Current \xB7 A", 0.02) + field("r", "Resistance \xB7 \u03A9", 600), () => {
      const v = num("v"), i = num("i"), r = num("r"), what = $("solve").value;
      if (what === "Current") {
        positive(r);
        output([["Current", fmt(v / r) + " A"]], "I = V/R");
      } else if (what === "Voltage") {
        positive(r);
        output([["Voltage", fmt(i * r) + " V"]], "V = IR");
      } else if (what === "Resistance") {
        if (i === 0) throw Error("Current cannot be zero");
        output([["Resistance", fmt(v / i) + " \u03A9"]], "R = V/I");
      } else output([["Power", fmt(v * i) + " W"]], "P = VI; signed absorbed power.");
    });
    if (tab === "Equation check") form(field("v", "Voltage \xB7 V", 12) + field("i", "Current \xB7 A", 0.02) + field("r", "Resistance \xB7 \u03A9", 600) + field("p", "Power \xB7 W", 0.24) + field("tol", "Relative tolerance \xB7 %", 0.1), () => {
      positive(num("r"));
      if (num("tol") < 0) throw Error("Tolerance cannot be negative");
      const check = (actual, expected) => Math.abs(actual - expected) <= Math.max(1e-9, Math.abs(expected) * num("tol") / 100);
      output([["V = IR", check(num("v"), num("i") * num("r")) ? "Consistent" : "Not consistent"], ["P = VI", check(num("p"), num("v") * num("i")) ? "Consistent" : "Not consistent"], ["Voltage residual", fmt(num("v") - num("i") * num("r"), 6) + " V"], ["Power residual", fmt(num("p") - num("v") * num("i"), 6) + " W"]], "Numeric consistency check for a resistive DC branch. This does not prove component suitability or circuit safety.");
    });
    if (tab === "Circuit builder") builder();
    if (tab === "Symbols") {
      $("content").innerHTML = '<section class="card"><h2>Symbol library</h2>' + Object.entries(names).map(([type, name]) => `<div class="symbol"><svg viewBox="-2 -14 48 28">${symbols[type]}</svg><span>${name}</span></div>`).join("") + "<p>Ideal DC and sinusoidal AC components supported by the circuit solver. AC sources use RMS values and phase angles; capacitors and inductors require AC mode. Node 0 provides the voltage reference. Wires and closed switches are zero-volt ideal constraints.</p></section>";
    }
    if (tab === "Voltage drop") form(field("len", "One-way length \xB7 m", 10) + field("cross", "Conductor area \xB7 mm\xB2", 2.5) + field("rho", "Resistivity \xB7 \u03A9\xB7mm\xB2/m", 0.0175) + field("i", "Load current \xB7 A", 5) + field("v", "Supply \xB7 V", 24), () => {
      positive(num("len"), num("cross"), num("rho"), num("v"));
      const r = 2 * num("rho") * num("len") / num("cross"), drop = Math.abs(num("i")) * r;
      output([["Loop resistance", fmt(r) + " \u03A9"], ["Voltage drop", fmt(drop) + " V"], ["Percentage", fmt(drop / num("v") * 100) + " %"], ["Cable loss", fmt(num("i") ** 2 * r) + " W"]], "Two-wire DC loop at constant resistivity. Excludes contacts and temperature correction. This is not a cable ampacity or protection-sizing tool.");
    });
    if (tab === "Energy") form(field("power", "Power \xB7 W", 1e3) + field("hours", "Use \xB7 hours", 3) + field("tariff", "Tariff \xB7 currency/kWh", 0.25), () => {
      if ([num("power"), num("hours"), num("tariff")].some((x) => x < 0)) throw Error("Values cannot be negative");
      const energy = num("power") * num("hours") / 1e3;
      output([["Energy", fmt(energy) + " kWh"], ["Cost", fmt(energy * num("tariff"), 2) + " currency units"]], "Energy = power \xD7 time. Fixed power and tariff; standing charges excluded.");
    });
    if (tab === "RC timing") form(field("r", "Resistance \xB7 \u03A9", 1e4) + field("c", "Capacitance \xB7 \xB5F", 100) + field("v", "Step voltage \xB7 V", 5) + field("time", "Elapsed time \xB7 s", 1), () => {
      positive(num("r"), num("c"));
      if (num("time") < 0) throw Error("Time cannot be negative");
      const tau = num("r") * num("c") / 1e6;
      output([["Time constant", fmt(tau) + " s"], ["Charging capacitor voltage", fmt(num("v") * (1 - Math.exp(-num("time") / tau))) + " V"], ["Time to 99%", fmt(-tau * Math.log(0.01)) + " s"]], "Ideal series RC charging from zero initial voltage; ideal voltage step.");
    });
  });
})();
</script></body></html>
