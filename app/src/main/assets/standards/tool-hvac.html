      output([["Room volume", fmt(vol) + " m\xB3"], ["Required flow", fmt(q) + " m\xB3/s"], ["Required flow", fmt(q * 1e3) + " L/s"], ["Pitot ideal velocity", fmt(Math.sqrt(2 * num("pressure") / num("rho"))) + " m/s"], ["Filter face area", fmt(area) + " m\xB2"], ["Filter face velocity at required flow", fmt(q / area) + " m/s"]], "ACH = 3600Q/V. Pitot v = \u221A(2\u0394p/\u03C1), coefficient 1 assumed. These are geometry/flow calculations; select room criteria and traverse methods from the project specification.");
    }, help);
    if (tab === "Canopy") form(select("zones", "Zones", ["Single", "Dual"]) + field("x", "Canopy X \xB7 mm", 3200) + field("y", "Canopy Y \xB7 mm", 3200) + field("zx", "Central zone X \xB7 mm", 2080) + field("zy", "Central zone Y \xB7 mm", 2080) + field("v1", "Central face velocity \xB7 m/s", 0.45) + field("v2", "Outer face velocity \xB7 m/s", 0.45) + field("units", "Outer / booster units", 4) + field("ahu", "AHU supply \xB7 m\xB3/s", 1.41), () => {
      positive(num("x"), num("y"), num("zx"), num("zy"), num("v1"), num("v2"), num("units"));
      if (!Number.isInteger(num("units")) || num("ahu") < 0) throw Error("Use a whole positive unit count and non-negative AHU flow.");
      const total = num("x") * num("y") / 1e6, dual = $("zones").value === "Dual", central = dual ? num("zx") * num("zy") / 1e6 : total;
      if (dual && (num("zx") > num("x") || num("zy") > num("y"))) throw Error("Central zone must fit inside the canopy.");
      const q1 = central * num("v1"), q2 = (total - central) * num("v2"), deficit = q1 - num("ahu");
      output([["Central flow", fmt(q1) + " m\xB3/s"], ["Outer flow", fmt(q2) + " m\xB3/s"], ["Total face flow", fmt(q1 + q2) + " m\xB3/s"], ["AHU deficit / surplus", fmt(deficit) + " m\xB3/s"], ["Duty per unit", fmt((dual ? q2 : Math.max(0, deficit)) / num("units")) + " m\xB3/s"]], "Transferred from the supplied canopy workbook: Q = face area \xD7 velocity. Negative AHU deficit means excess supply. No unvalidated fixed 0.07 m/s velocity-decay correction is applied. This is not a kitchen capture or clinical-cleanliness certification model.");
    }, help);
    if (tab === "DW/144") {
      $("content").innerHTML = `<section class="card"><h2>DW/144 \u2014 construction reference</h2><p>The calculator uses internal duct area to relate flow and mean velocity. A calculated size alone does not determine sheet thickness, reinforcement, joint type, leakage class or pressure suitability.</p><p>Use the original DW/144 document in Standards for pressure/velocity classes, rectangular and circular construction tables, joints and stiffening. Define the pressure of each duct section; do not substitute fan pressure for every duct section.</p><p>Equal-area conversions in the workbook preserve velocity at equal flow. They do not guarantee equal pressure loss.</p><small>Source: supplied DW/144, general notes (printed page 10) and construction tables. Workbook: Duct Size Calculator, Canopy Sizing Calculator, Room Volumes, Filter Sizes and Sensor Equations.</small></section>`;
    }
  });
